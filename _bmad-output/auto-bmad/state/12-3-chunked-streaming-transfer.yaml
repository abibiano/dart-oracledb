  - "The UTF-8-form CLOB stream branch is unreachable on both AL32UTF8 fixtures — needs the optional non-AL32UTF8 fixture for coverage."
  - "closeLobs() on a streaming result set also closes not-yet-delivered handles (documented sharp edge)."
  - "No live proof for the read-continuation loop: no server short-reads were observed."
