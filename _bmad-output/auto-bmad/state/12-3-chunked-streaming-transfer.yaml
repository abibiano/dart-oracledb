  - "AC8 mandates live measurement on BOTH fixtures for five unknowns rather than guessing: whether READ's SB8 amount is the units actually delivered; whether a single READ ever short-reads (and at what size); what the server returns when a piece boundary splits a surrogate pair in UTF-8 vs UTF-16 form; whether a LOB READ between two FETCHes disturbs an open cursor; the exact failure point of the pre-existing cursor-row-with-LOB decode limitation."
deferred_work:
  - "Cursor rows carrying a LOB are undecodable (ORA-12547 / BufferException 'Integer too large: size=114 exceeds maxSize=8' in decodeExecuteResponse) on BOTH versions; on 21c it POISONS THE TRANSPORT. Diagnosed per AC8, not fixed — blocks wrapping nested-CURSOR()/REF-CURSOR LOB columns. target: Epic 12 follow-up (protocol/decode story)."
  - "Full-length single READ scales super-linearly (33.5M-unit CLOB = 141s on 23ai; doubling size ~quadruples time) — LOB_DATA accumulate/concat path. Perf follow-up; streams are the linear alternative."
